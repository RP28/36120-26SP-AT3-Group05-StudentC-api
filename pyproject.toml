[project]
name = "student-c-trend-service"
version = "0.1.0"
description = "AT3 Group05 Student C FastAPI service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi[standard]==0.139.0", 
    "uvicorn==0.50.0", 
    "pydantic-settings>=2.5,<3", 
    "httpx>=0.27,<1", 
    "pandas==2.2.2", 
    "numpy>=1.26,<3", 
    "cloudpickle==3.1.2",
    "mlweave==0.2.3",
    "joblib==1.5.3",
    "matplotlib==3.11.0",
    "scikit-learn==1.6.1", 
    "xgboost==3.3.0"
]

[tool.uv.sources]
mlweave = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=html --cov-report=json --cov-fail-under=100"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100
